name: Rehab portfolio release QA

on:
  push:
    branches: [main]
    paths:
      - "apps/atelier-08/**"
      - ".github/workflows/rehab-portfolio-qa.yml"
  pull_request:
    paths:
      - "apps/atelier-08/**"
      - ".github/workflows/rehab-portfolio-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python apps/atelier-08/tools/check_release.py

  visual-snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chromium and Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Serve local production files
        run: |
          python3 -m http.server 8181 --bind 127.0.0.1 --directory apps/atelier-08 > /tmp/portfolio-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8181/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/portfolio-server.log
          exit 1
      - name: Capture actual Arabic/English desktop and mobile layouts
        run: |
          mkdir -p portfolio-screenshots
          npx playwright screenshot --browser chromium --wait-for-timeout 1800 --full-page --viewport-size "1440,900" http://127.0.0.1:8181/ portfolio-screenshots/arabic-desktop.png
          npx playwright screenshot --browser chromium --wait-for-timeout 1800 --full-page --viewport-size "1440,900" http://127.0.0.1:8181/en/index.html portfolio-screenshots/english-desktop.png
          npx playwright screenshot --browser chromium --wait-for-timeout 1800 --full-page --viewport-size "390,844" http://127.0.0.1:8181/ portfolio-screenshots/arabic-mobile.png
          npx playwright screenshot --browser chromium --wait-for-timeout 1800 --full-page --viewport-size "390,844" http://127.0.0.1:8181/en/index.html portfolio-screenshots/english-mobile.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rehab-cinematic-layout-snapshots
          path: portfolio-screenshots/*.png
          if-no-files-found: warn
          retention-days: 14
